<div class="landing-page">
	<header class="hero">
		<nav class="hero-pills" aria-label="Primary">
			@for (link of pills; track link.path) {
				<a class="hero-pill" [routerLink]="link.path" routerLinkActive="active">{{ link.label }}</a>
			}
		</nav>

		<div class="hero-inner">
			<app-hero-search [showHeadings]="false" />
		</div>
	</header>

	<app-cuisine-strip />

	<app-home-promo />

	<div class="brand-lockup">
		<app-logo-mark [size]="44" />
		<span class="brand-lockup-wordmark">Foodie Inc</span>
	</div>

	<app-app-download />
</div>

<app-auth-prompt />
