<section
	class="carousel"
	role="group"
	aria-roledescription="carousel"
	aria-label="Browse dishes from restaurants near you"
	(mouseenter)="pause()"
	(mouseleave)="resume()"
	(focusin)="pause()"
	(focusout)="resume()"
	(keydown)="onKeydown($event)">

	<div
		class="viewport"
		(touchstart)="onTouchStart($event)"
		(touchend)="onTouchEnd($event)">

		@for (slide of slides(); track slide.key; let i = $index) {
			<div
				class="slide"
				role="group"
				aria-roledescription="slide"
				[attr.aria-label]="slide.label + ' (' + (i + 1) + ' of ' + slides().length + ')'"
				[class.active]="i === index()"
				[attr.aria-hidden]="i === index() ? null : 'true'"
				[attr.inert]="i === index() ? null : ''">
				<button type="button" class="slide-btn" (click)="openSlide(slide)">
					<app-smart-image
						class="slide-img"
						[src]="slide.image"
						[alt]="slide.alt"
						aspectRatio="4 / 3"
						[priority]="i === 0"
						[lazy]="i !== 0"
						[rounded]="false"
						(loadFailed)="onImageFailed(slide)" />
					<span class="slide-caption">
						<span class="slide-label">{{ slide.label }}</span>
						@if (slide.caption) {
							<span class="slide-sub">{{ slide.caption }}</span>
						}
					</span>
				</button>
			</div>
		}
	</div>

	<button type="button" class="arrow arrow-prev" (click)="previous()" aria-label="Previous dish">
		<span aria-hidden="true">‹</span>
	</button>
	<button type="button" class="arrow arrow-next" (click)="next()" aria-label="Next dish">
		<span aria-hidden="true">›</span>
	</button>

	<div class="dots" role="tablist" aria-label="Choose a dish">
		@for (slide of slides(); track slide.key; let i = $index) {
			<button
				type="button"
				class="dot"
				role="tab"
				[class.active]="i === index()"
				[attr.aria-selected]="i === index()"
				[attr.aria-label]="slide.label"
				(click)="goTo(i)"></button>
		}
	</div>

	<p class="sr-only" aria-live="polite">{{ current().label }}</p>
</section>
