<section class="download" aria-labelledby="download-heading">
	<div class="download-inner">
		<div class="download-art">
			<app-smart-image
				class="phone"
				src="/phone.png"
				alt="The Foodie Inc app on a smartphone, showing a restaurant search and nearby listings"
				aspectRatio="1 / 2"
				[rounded]="false" />
		</div>

		<div class="download-copy">
			<p class="eyebrow">Foodie Inc on mobile</p>
			<h2 id="download-heading">Get the app</h2>
			<p class="lede">
				Track your order door to door, reorder your usual in two taps, and get told the
				moment your driver is close.
			</p>

			<div class="badges">
				<a class="badge" [href]="links.apple" target="_blank" rel="noopener noreferrer">
					<i class="fa-brands fa-apple badge-glyph" aria-hidden="true"></i>
					<span class="badge-text">
						<span class="badge-small">Download on the</span>
						<span class="badge-large">App Store</span>
					</span>
				</a>

				<a class="badge" [href]="links.google" target="_blank" rel="noopener noreferrer">
					<!-- Drawn rather than taken from the icon font, because the Play mark
					     is four colours and the font only has it as one. -->
					<svg class="badge-glyph play-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
						<path fill="#00D2FF" d="M3.609 1.814 13.792 12 3.61 22.186a1 1 0 0 1-.61-.92V2.734a1 1 0 0 1 .609-.92z" />
						<path fill="#00F076" d="M3.609 1.814 16.793 8.986 13.793 12z" />
						<path fill="#FFCE00" d="M16.793 15.014 13.793 12l3-3.014 3.502 2.001c.719.4.719 1.6 0 2z" />
						<path fill="#FF3A44" d="M3.609 22.186 13.793 12l3 3.014z" />
					</svg>
					<span class="badge-text">
						<span class="badge-small">Get it on</span>
						<span class="badge-large">Google Play</span>
					</span>
				</a>
			</div>
		</div>
	</div>
</section>
