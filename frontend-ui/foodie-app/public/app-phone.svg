<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" width="300" height="600" role="presentation">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A1B40"/>
      <stop offset="100%" stop-color="#1E1330"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F58C24"/>
      <stop offset="100%" stop-color="#EE3124"/>
    </linearGradient>
  </defs>

  <!-- device body -->
  <rect x="8" y="8" width="284" height="584" rx="42" fill="#120B1E"/>
  <rect x="16" y="16" width="268" height="568" rx="36" fill="url(#screen)"/>

  <!-- notch -->
  <rect x="112" y="26" width="76" height="12" rx="6" fill="#120B1E"/>

  <!-- app bar with the cloche mark -->
  <g transform="translate(40 62) scale(0.85)">
    <circle cx="16" cy="6.4" r="2.2" fill="#F8BF73"/>
    <path d="M4.5 21.4a11.5 11.5 0 0 1 23 0Z" fill="#F58C24"/>
    <path d="M13 14.6v4.4M16 13.7v5.3M19 14.6v4.4" stroke="#2A1B40" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="1.8" y="22.1" width="28.4" height="3.4" rx="1.7" fill="#EE3124"/>
  </g>
  <rect x="76" y="70" width="78" height="11" rx="5.5" fill="#F5F0FA" fill-opacity="0.9"/>

  <!-- search field -->
  <rect x="38" y="104" width="224" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.95"/>
  <circle cx="58" cy="121" r="6" fill="none" stroke="#64748B" stroke-width="2"/>
  <path d="M62.5 125.5 L68 131" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <rect x="76" y="116" width="104" height="9" rx="4.5" fill="#CBD5E1"/>

  <!-- featured card -->
  <rect x="38" y="154" width="224" height="118" rx="14" fill="url(#hero)"/>
  <circle cx="232" cy="182" r="34" fill="#FFFFFF" fill-opacity="0.12"/>
  <rect x="54" y="238" width="72" height="18" rx="9" fill="#1E1330" fill-opacity="0.8"/>

  <!-- restaurant rows -->
  <g fill="#FFFFFF" fill-opacity="0.08">
    <rect x="38" y="290" width="224" height="66" rx="12"/>
    <rect x="38" y="368" width="224" height="66" rx="12"/>
    <rect x="38" y="446" width="224" height="66" rx="12"/>
  </g>
  <g fill="#F58C24" fill-opacity="0.85">
    <rect x="50" y="302" width="42" height="42" rx="10"/>
    <rect x="50" y="380" width="42" height="42" rx="10"/>
    <rect x="50" y="458" width="42" height="42" rx="10"/>
  </g>
  <g fill="#F5F0FA" fill-opacity="0.75">
    <rect x="104" y="308" width="104" height="9" rx="4.5"/>
    <rect x="104" y="386" width="118" height="9" rx="4.5"/>
    <rect x="104" y="464" width="96" height="9" rx="4.5"/>
  </g>
  <g fill="#B8A8CC" fill-opacity="0.6">
    <rect x="104" y="326" width="64" height="7" rx="3.5"/>
    <rect x="104" y="404" width="78" height="7" rx="3.5"/>
    <rect x="104" y="482" width="56" height="7" rx="3.5"/>
  </g>

  <!-- home indicator -->
  <rect x="118" y="562" width="64" height="5" rx="2.5" fill="#F5F0FA" fill-opacity="0.35"/>
</svg>
