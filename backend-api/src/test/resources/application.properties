# Test configuration — uses H2 in-memory database (no MySQL required)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT configuration (test values)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration=86400000

# Keep test data fully controlled by each test case.
app.dev-seed.enabled=false

# Stripe and VAPID are not exercised in tests; blank values keep the context loadable.
stripe.secret-key=
stripe.publishable-key=
stripe.webhook-secret=
stripe.success-url=http://localhost/order/success?session_id={CHECKOUT_SESSION_ID}
stripe.cancel-url=http://localhost/order/cancelled

vapid.public-key=
vapid.private-key=
vapid.subject=mailto:test@foodieinc.local
