# ================================
# Server Configuration
# ================================
server.port=8080
server.servlet.context-path=/api

# ================================
# Database Configuration (MySQL)
# ================================
spring.datasource.url=jdbc:mysql://localhost:3307/foodiedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
# Use environment variable with fallback
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================
# JPA / Hibernate Configuration
# ================================
# Consider 'validate' or 'none' in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ================================
# JWT Configuration
# ================================
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 hours in milliseconds
app.jwt.expiration=86400000

# ================================
# CORS Configuration
# ================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ================================
# File Upload Configuration
# ================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ================================
# Logging Configuration
# ================================
logging.level.com.foodieinc=DEBUG
logging.level.org.springframework.security=DEBUG
# Optional: log all raw SQL
logging.level.org.hibernate.SQL=DEBUG
# Optional: log parameter bindings
logging.level.org.hibernate.type.descriptor.sql=TRACE

# ================================
# MVC + Error Handling
# ================================
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
# Show error messages in API responses
server.error.include-message=always

# ================================
# Stripe Configuration
# ================================
# Blank by default so the app boots without Stripe credentials.
# Export STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET to exercise payments locally.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success-url=http://localhost:4200/order/success?session_id={CHECKOUT_SESSION_ID}
stripe.cancel-url=http://localhost:4200/order/cancelled

# ================================
# VAPID Push Notification Configuration
# ================================
# Blank keys disable web push; the app still starts.
vapid.public-key=${VAPID_PUBLIC_KEY:}
vapid.private-key=${VAPID_PRIVATE_KEY:}
vapid.subject=${VAPID_SUBJECT:mailto:dev@foodieinc.local}
