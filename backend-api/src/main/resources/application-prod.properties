# ===================================
# ? Server Configuration (Production)
# ===================================
server.port=8080
server.servlet.context-path=/api

# ===================================
# ?? Database Configuration (Production)
# ===================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================
# ?? JPA / Hibernate Configuration
# ===================================
spring.jpa.hibernate.ddl-auto=validate                    # Prevent schema changes
spring.jpa.show-sql=false                                 # Hide SQL in logs
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false          # Skip pretty-printing for cleaner logs
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===================================
# ? JWT Configuration (Production)
# ===================================
app.jwt.secret=${JWT_SECRET}                              # Inject via environment or secure vault
app.jwt.expiration=86400000                               # 24 hours in milliseconds

# ===================================
# ? CORS Configuration
# ===================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ===================================
# ? File Upload Configuration
# ===================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================
# ? Logging Configuration (Production)
# ===================================
logging.level.com.foodieinc=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF

# ===================================
# ? Error & Path Matching
# ===================================
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
server.error.include-message=never                        # Hide error messages in production responses
server.forward-headers-strategy=framework
