# ===================================
# ? Server Configuration (Production)
# ===================================
server.port=8080
server.servlet.context-path=/api

# ===================================
# ?? Database Configuration (Production)
# ===================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================
# ?? JPA / Hibernate Configuration
# ===================================
# Prevent schema changes
spring.jpa.hibernate.ddl-auto=update

# Hide SQL in logs
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Skip pretty-printing for cleaner logs
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===================================
# ? JWT Configuration (Production)
# ===================================
# Inject via environment or secure vault
app.jwt.secret=${JWT_SECRET}

# 24 hours in milliseconds
app.jwt.expiration=86400000

# ===================================
# ? CORS Configuration
# ===================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ===================================
# ? File Upload Configuration
# ===================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================
# ? Logging Configuration (Production)
# ===================================
logging.level.com.foodieinc=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF

# ===================================
# ? Error & Path Matching
# ===================================
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
# Hide error messages in production responses
server.error.include-message=NEVER
server.forward-headers-strategy=framework

# ===================================
# ? Stripe Configuration
# ===================================
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
stripe.success-url=https://www.foodieapp.co.za/order/success?session_id={CHECKOUT_SESSION_ID}
stripe.cancel-url=https://www.foodieapp.co.za/order/cancelled

# ===================================
# 🔔 VAPID Push Notification Configuration
# ===================================
vapid.public-key=${VAPID_PUBLIC_KEY}
vapid.private-key=${VAPID_PRIVATE_KEY}
vapid.subject=${VAPID_SUBJECT}
