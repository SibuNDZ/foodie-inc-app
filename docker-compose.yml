services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: foodiedb
      MYSQL_USER: ${DB_USERNAME:-foodie}
      MYSQL_PASSWORD: ${DB_PASSWORD:-foodie_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"

  backend-api:
    build:
      context: ./backend-api
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      DB_URL: jdbc:mysql://db:3306/foodiedb?useSSL=false&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-foodie}
      DB_PASSWORD: ${DB_PASSWORD:-foodie_pass}
      JWT_SECRET: ${JWT_SECRET:-change_me_please_change}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:4000}
      UPLOAD_DIR: /app/uploads
    volumes:
      - upload-data:/app/uploads
    depends_on:
      - db
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend-ui/foodie-app
    environment:
      PORT: 4000
      API_URL: http://backend-api:8080
    depends_on:
      - backend-api
    ports:
      - "4000:4000"

volumes:
  db-data:
  upload-data:
